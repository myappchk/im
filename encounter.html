<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visit Form — Megan Morkel — Incidents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#17212B; --ink2:#465363; --ink3:#768292;
  --line:#DAE0E7; --line2:#EDF0F4;
  --canvas:#EDF0F3; --paper:#FFFFFF; --paper2:#F7F9FB;
  --brand:#0B3B66; --brand2:#1A4F85; --tint:#E6EEF7;
  --ring:0 0 0 3px rgba(26,79,133,.14);
  --pop:0 12px 32px rgba(15,35,60,.16),0 2px 6px rgba(15,35,60,.08);
  --nav-h:48px; --bar-h:30px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:13.5px;line-height:1.4;color:var(--ink);background:var(--canvas);
  display:grid;grid-template-rows:var(--nav-h) auto minmax(0,1fr) auto var(--bar-h);grid-template-columns:minmax(0,1fr);overflow:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg{flex-shrink:0}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11.5px;font-weight:500;padding:4px 8px;border-radius:5px;white-space:nowrap;z-index:60;pointer-events:none}

/* ─── Top nav ─── */
.nav{background:var(--brand);display:flex;align-items:center;gap:10px;padding:0 12px;color:#fff;z-index:40}
.nav-menu{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff}
.nav-menu:hover{background:rgba(255,255,255,.2)}
/* ─── Nav drawer ─── */
.nav-drawer{position:fixed;top:48px;left:0;z-index:600;width:224px;background:#fff;border:1px solid #DAE0E7;border-radius:0 10px 10px 0;box-shadow:4px 8px 24px rgba(0,0,0,.12);padding:6px;display:none}
.nav-drawer.open{display:block}
.nav-drawer a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;font-size:13.5px;font-weight:500;color:#17212B;text-decoration:none}
.nav-drawer a:hover{background:#EEF4FB;color:#1A4F85}
.nav-drawer a.active{background:#EEF4FB;color:#1A4F85;font-weight:600}
.nav-drawer a svg{flex-shrink:0;color:#768292}
.nav-drawer a:hover svg,.nav-drawer a.active svg{color:#1A4F85}
.nav-drawer-sep{height:1px;background:#EDF0F4;margin:4px 0}
.nav-drawer-hd{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#9AA5B1;padding:8px 12px 4px}
.nav-search{display:flex;align-items:center;height:32px;width:min(550px,34vw);background:#fff;border-radius:6px;overflow:hidden}
.nav-search input{flex:1;min-width:0;border:0;outline:0;padding:0 12px;font-size:13px;color:var(--ink)}
.nav-search input::placeholder{color:#9AA5B1}
.nav-search .dd{width:28px;height:100%;display:grid;place-items:center;color:var(--ink3)}
.nav-search .go{width:36px;height:100%;display:grid;place-items:center;color:var(--ink2);border-left:1px solid var(--line2);background:var(--paper2)}
.nav-search .go:hover{background:var(--tint);color:var(--brand)}
.chip{display:flex;align-items:center;height:32px;background:#fff;border-radius:6px;overflow:hidden;color:var(--ink)}
.chip .lead{width:32px;height:100%;display:grid;place-items:center;color:var(--brand);border-right:1px solid var(--line2)}
.chip .txt{padding:0 8px 0 10px;font-size:13px;font-weight:600;color:var(--brand)}
.chip .x{width:26px;height:100%;display:grid;place-items:center;color:var(--ink3)}
.chip .x:hover{color:var(--ink);background:var(--paper2)}
.chip select{height:100%;border:0;outline:0;padding:0 28px 0 10px;font-size:13px;font-weight:500;color:var(--ink2);appearance:none;-webkit-appearance:none;cursor:pointer;background:#fff url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23768292' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 9px center}
.chip .rf{width:32px;height:100%;display:grid;place-items:center;color:var(--ink2);border-left:1px solid var(--line2)}
.chip .rf:hover{background:var(--tint);color:var(--brand)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.nav-ic{position:relative;width:34px;height:34px;border-radius:6px;display:grid;place-items:center;color:#DCE6F2}
.nav-ic:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-badge{position:absolute;top:1px;right:0;min-width:17px;height:16px;padding:0 4px;border-radius:999px;font-size:10px;font-weight:700;line-height:16px;text-align:center;color:#fff;background:#D93A2B;box-shadow:0 0 0 2px var(--brand)}
.nav-badge.amber{background:#E3A92B;color:var(--ink)}
.nav-user{display:flex;align-items:center;gap:10px;height:34px;padding:0 4px 0 14px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px;font-weight:600;color:#fff}
.nav-user:hover{background:rgba(255,255,255,.16)}
.nav-av{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center}

/* ─── Chart toolbar ─── */
.bar{background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 12px;flex-wrap:wrap}
.ctype{display:flex;flex-direction:column;gap:3px}
.lbl{font-size:12px;color:var(--ink3)}
.ctype select{height:32px;min-width:150px;border:1px solid var(--line);border-radius:6px;padding:0 30px 0 10px;font-size:13px;font-weight:500;appearance:none;-webkit-appearance:none;cursor:pointer;background:#fff url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23465363' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 10px center;outline:0}
.ctype select:focus{border-color:var(--brand2);box-shadow:var(--ring)}
.inoffice{align-self:flex-end;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;background:#FFF6DC;border:1px solid #F1DB9B;color:#6B4A07;font-size:13px;font-weight:500}
.inoffice i{width:7px;height:7px;border-radius:50%;background:#E3A92B}
.timer{display:flex;flex-direction:column;gap:3px}
.timer-row{display:flex;align-items:center;gap:8px;height:32px}
.tbox{display:flex;gap:2px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper2)}
.tbox div{display:flex;flex-direction:column;align-items:center;justify-content:center;width:36px;height:30px;background:#fff}
.tbox b{font-size:14px;font-weight:600;line-height:1}
.tbox small{font-size:10px;color:var(--ink3);line-height:1.1;margin-top:1px}
.play{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brand2);color:#fff}
.play:hover{background:var(--brand)}
.play.on{background:#B42318}
.tools{margin-left:auto;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tb{height:34px;min-width:34px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;white-space:nowrap}
.tb:hover{border-color:#B9C4D0;color:var(--brand);background:var(--tint)}
.tb{--icon-bg:var(--paper)}
.tb:hover{--icon-bg:var(--tint)}
.tb.split{padding:0}
.tb.split span{height:100%;display:grid;place-items:center;padding:0 8px}
.tb.split span + span{border-left:1px solid var(--line2);padding:0 5px}
.tb.signoff{color:var(--ink);font-weight:600}
.tsep{width:1px;height:24px;background:var(--line);margin:0 4px}
.tb.ascvd svg{color:#4A90D9}
.tb.note{font-weight:600;color:var(--ink)}
.tmenu{position:fixed;width:380px;max-width:calc(100vw - 16px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop);z-index:70;overflow:hidden}
.inc-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--paper2);border-bottom:1px solid var(--line)}
.inc-hd h2{font-size:15px;font-weight:600;color:var(--brand)}
.inc-view-all{font-size:12.5px;font-weight:500;color:var(--brand2);text-decoration:none;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:#fff}
.inc-view-all:hover{background:var(--tint);border-color:#C5D6EA}
.inc-hd .sel{font-size:12px;color:var(--ink3)}
.inc-list{list-style:none;max-height:320px;overflow:auto}
.inc-item{display:flex;align-items:flex-start;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line2);cursor:pointer}
.inc-item:last-child{border-bottom:0}
.inc-item:hover{background:var(--paper2)}
.inc-item input{width:17px;height:17px;margin-top:2px;accent-color:var(--brand2);cursor:pointer;flex-shrink:0}
.inc-item .t{font-size:14px;font-weight:500;color:var(--ink);line-height:1.35}
.inc-item .d{font-size:12.5px;color:var(--ink3);margin-top:1px}
.inc-item.added{cursor:pointer}
.inc-item.added .t{color:var(--ink2)}
.inc-tag{display:inline-flex;align-items:center;gap:4px;margin-left:6px;height:18px;padding:0 7px;border-radius:999px;background:#E6F4EC;color:#2F8A56;font-size:11px;font-weight:600;vertical-align:1px}
.inc-ft{padding:12px 16px;border-top:1px solid var(--line)}
.inc-add{width:100%;height:36px;border-radius:6px;border:1px solid var(--brand2);background:var(--brand2);color:#fff;font-size:13.5px;font-weight:600}
.inc-add:hover:not(:disabled){background:var(--brand);border-color:var(--brand)}
.inc-add:disabled{background:var(--tint);border-color:#C5D6EA;color:#8FA8C4;cursor:not-allowed}
[aria-expanded="true"][data-tip]::after{display:none!important}
.vtoast{position:fixed;left:50%;bottom:48px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;padding:10px 16px;border-radius:8px;box-shadow:var(--pop);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.vtoast.show{opacity:1;transform:translate(-50%,0)}

/* ── View-all incidents slider ── */
#va-overlay{position:fixed;inset:0;background:rgba(14,28,48,.32);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
#va-overlay.open{opacity:1;pointer-events:all}
#va-panel{position:fixed;top:0;right:0;bottom:0;width:75vw;min-width:360px;max-width:1400px;background:#f4f8fb;z-index:201;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:-6px 0 32px rgba(8,18,42,.22);font-family:'IBM Plex Sans',Arial,sans-serif;font-size:13px;color:#003366}
#va-panel.open{transform:translateX(0)}
.va-hd{background:#f4f8fb;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid #d7dee5}
.va-hd-title{font-size:14.5px;font-weight:600;color:#000}
.va-close{background:none;border:none;color:#5a6e88;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:4px;transition:background .15s,color .15s}
.va-close:hover{background:#e1e8ef;color:#003366}
.va-body{display:flex;flex:1;min-height:0}
/* Left list */
.va-list{width:270px;flex-shrink:0;border-right:1px solid #d7dee5;overflow-y:auto;background:#edf2f7}
.va-item{display:flex;flex-direction:column;gap:3px;padding:14px 16px;border-bottom:1px solid #dde5ee;cursor:pointer;transition:background .12s;border-left:3px solid transparent}
.va-item:hover{background:#dce8f5}
.va-item.active{background:#d0e3f5;border-left-color:#1a4f85}
.va-item-date{font-size:11.5px;color:#808080;font-weight:500}
.va-item-title{font-size:13px;font-weight:600;color:#17212B;line-height:1.35}
.va-item.active .va-item-title{color:#003366}
.va-item-disabled{cursor:default;opacity:.55}
.va-item-disabled:hover{background:transparent}
/* Right detail */
.va-detail{flex:1;min-width:0;overflow-y:auto;padding:16px 20px;scroll-behavior:smooth}
.va-detail::-webkit-scrollbar{width:12px}
.va-detail::-webkit-scrollbar-track{background:#e7e7e7}
.va-detail::-webkit-scrollbar-thumb{background:#d1d3d5}
/* Reuse index.html iv-* classes */
.iv-sec{background:#fff;border:1px solid #d7dee5;padding:16px;margin-bottom:10px}
.iv-sec-hd{font-size:12.5px;font-weight:700;color:#000;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #eff1f3;display:flex;align-items:center;gap:8px}
.iv-g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 20px}
.iv-g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 20px}
.iv-field{margin-bottom:14px}
.iv-field:last-child{margin-bottom:0}
.iv-lbl{font-size:12.5px;font-weight:700;color:#808080;margin-bottom:4px}
.iv-val{font-size:13px;color:#000;line-height:1.55}
.iv-val-long{font-size:12.5px;color:#000;line-height:1.7}
.iv-yn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#000}
.iv-seq-list{display:flex;flex-direction:column;gap:6px}
.iv-seq-row{display:flex;gap:12px;padding:4px 0}
.iv-seq-time{font-size:12.5px;font-weight:700;color:#808080;white-space:nowrap;min-width:54px}
.iv-seq-desc{font-size:12.5px;color:#000;line-height:1.55}
.iv-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.iv-tbl th{text-align:left;font-size:12.5px;font-weight:700;color:#808080;padding:0 10px 8px;border-bottom:1px solid #eff1f3}
.iv-tbl td{padding:8px 10px;color:#000;border-bottom:1px solid #f4f8fb}
.iv-tbl tr:last-child td{border-bottom:none}
.iv-sig2-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.iv-sig2-box{border:1px solid #e2e9f0;background:#fff;overflow:hidden}
.iv-sig2-label{font-size:11px;font-weight:700;color:#5570a0;text-transform:uppercase;letter-spacing:.05em;padding:7px 12px;border-bottom:1px solid #edf2f7;background:#f8fafc}
.iv-sig2-canvas-view{min-height:68px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-style:italic;color:#a0b4c8;background:#f8fafc}
.iv-sig2-meta{padding:8px 12px;border-top:1px solid #edf2f7}
.iv-sig2-signame{font-size:12.5px;font-weight:600;color:#a0b4c8}
.va-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#a0b4c8;font-size:13.5px;gap:8px}

/* ─── Chart area ─── */
.chart{padding:0 12px 0 0;min-height:0;display:flex;position:relative}
.chart-card{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-top:0;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin;background:var(--paper)}
.tab{padding:11px 15px 9px;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap;border-bottom:2px solid transparent;border-right:1px solid var(--line2)}
.tab:hover{color:var(--ink);background:var(--paper2)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand2);font-weight:600}
.subtabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--paper2)}
.subtab{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 18px;font-size:13px;font-weight:500;color:var(--ink3);white-space:nowrap;border-bottom:2px solid transparent;border-right:1px solid var(--line2)}
.subtab:hover{color:var(--ink);background:#fff}
.subtab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand2);font-weight:600;background:#fff}
.subtab-close{display:grid;place-items:center;width:18px;height:18px;border-radius:4px;color:var(--ink3);flex-shrink:0;transition:background .12s,color .12s}
.subtab-close:hover{background:#FFE4E4;color:#B42318}
.pane{flex:1;overflow:auto;min-height:0}

/* right quick-access rail */
.rail{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:30}
.rail button{width:30px;height:30px;border-radius:6px 0 0 6px;display:grid;place-items:center;color:#fff;background:var(--c);box-shadow:0 2px 6px rgba(15,35,60,.18);transition:width .15s}
.rail button:hover{width:36px}
.rail [data-tip]:hover::after{top:50%;left:auto;right:calc(100% + 8px);transform:translateY(-50%)}

/* other forms */
.forms-bar{display:flex;justify-content:flex-end;padding:8px 12px;background:var(--canvas);position:relative}
.of-btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink)}
.of-btn:hover{border-color:#B9C4D0;background:var(--tint);color:var(--brand)}
.of-btn .car{transition:transform .15s}
.of-btn[aria-expanded="true"] .car{transform:rotate(180deg)}
.of-menu{position:absolute;right:12px;bottom:calc(100% - 2px);min-width:220px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--pop);padding:6px;z-index:70}
.of-menu .hd{font-size:12px;color:var(--ink3);padding:6px 10px}
.of-menu .none{font-size:13px;color:var(--ink2);padding:6px 10px 8px}

/* bottom bar */
.bottom{background:#E4EAF1;border-top:1px solid #D2DAE3;display:flex;align-items:center;font-size:12.5px;color:#4E5B6B}
.bottom .ib{width:30px;height:100%;display:grid;place-items:center;color:#5A6776}
.bottom .ib:hover{background:#D6DEE8}
.screens{display:flex;height:100%}
.screens button{padding:0 14px;border-right:1px solid #D2DAE3;color:#4E5B6B;font-size:12.5px;display:flex;align-items:center;gap:6px}
.screens button:first-child{border-left:1px solid #D2DAE3}
.screens button:hover{background:#D6DEE8}
.screens button[aria-current="true"]{background:var(--brand);color:#fff;font-weight:600}
.copy{margin-left:auto;padding:0 10px;color:#7A8696}
.bottom .bug{width:30px;height:100%;display:grid;place-items:center;background:var(--brand);color:#fff}

@media (max-width:1200px){ .nav-search{width:auto;flex:1} .chip.enc select{max-width:150px} }
@media (max-width:760px){ .nav .chip.enc,.nav-user span{display:none} .tools{margin-left:0} .screens{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── Incident Report Slider ── */
#ir-overlay{position:fixed;inset:0;background:rgba(14,28,48,.42);z-index:800;opacity:0;pointer-events:none;transition:opacity .28s}
#ir-overlay.ir-open{opacity:1;pointer-events:all}
#ir-panel{position:fixed;top:0;right:0;bottom:0;width:75vw;min-width:360px;max-width:1400px;background:#fff;z-index:900;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:-8px 0 36px rgba(10,25,45,.2)}
#ir-panel.ir-open{transform:translateX(0)}
#ir-panel iframe{flex:1;border:none;width:100%;min-height:0}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>

(function(){
  var btn = document.querySelector('.nav-menu') || document.querySelector('.nav-menu-btn');
  var drawer = document.getElementById('navDrawer');
  if (!btn || !drawer) return;
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    var open = drawer.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
  });
  document.addEventListener('click', function(){
    drawer.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
  });
  drawer.addEventListener('click', function(e){ e.stopPropagation(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ drawer.classList.remove('open'); btn.setAttribute('aria-expanded','false'); } });
})();
</script>
</body>
</html>
